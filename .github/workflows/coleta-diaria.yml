name: Coleta diária do painel de moda

# 09:30 UTC = 06:30 em Brasília. Roda antes da rotina de análise das 07:00,
# para que a sessão do Claude já encontre o snapshot do dia commitado.
# Workflow agendado só dispara no branch padrão do repositório.
on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta-diaria
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml

      - name: Coletar e consolidar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python3 scripts/coletar.py
          python3 scripts/consolidar.py

      - name: Commitar snapshot
        run: |
          git config user.name "swisz-monitor"
          git config user.email "actions@github.com"
          git add dados/ monitoramento/contas.yml
          if git diff --cached --quiet; then
            echo "nada novo para commitar"
            exit 0
          fi
          git commit -m "Coleta do painel — $(date -u +%Y-%m-%d)"
          for tentativa in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push falhou, tentativa ${tentativa}"
            sleep $((2 ** tentativa))
          done
          exit 1
