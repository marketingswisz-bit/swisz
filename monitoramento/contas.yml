# Perfis monitorados pela rotina diária de análise de conteúdo.
#
# tier — define o papel da conta na leitura de difusão de tendência:
#   farol        onde a tendência aparece primeiro (mídia, marca premium, vanguarda)
#   traducao     quem traduz a tendência para a mulher real (criadoras de estilo)
#   concorrente  disputa a mesma cliente e a mesma faixa de preço da Swisz
#   massa        varejo grande; quando chega aqui, a tendência já é mainstream
#
# status — confirmada | a_validar | invalida
#   'a_validar' são sugestões deste agente ainda não verificadas na API.
#   A coleta marca sozinha como 'invalida' o handle que não resolve
#   (não existe, ou não é conta Business/Creator — a API não lê conta pessoal).
#
# Edite à vontade: adicione, remova, mude tier. A rotina lê este arquivo todo dia.

versao: 1

contas:

  # ---------- Indicadas pela Swisz ----------

  - handle: stealthelook
    tier: farol
    nota: Maior portal de moda do Brasil. Pauta o que vira assunto na semana.
    status: confirmada

  - handle: oqvestir
    tier: farol
    nota: Multimarca premium. Antecipa peça e styling que descem de faixa depois.
    status: confirmada

  - handle: nativozza
    tier: farol
    nota: Criadora com marca própria. Bom sinal de peça que vira desejo.
    status: confirmada

  - handle: amaro
    tier: concorrente
    nota: E-commerce de moda feminina com produção própria. Concorrente mais direto.
    status: confirmada

  - handle: martinaoficial
    tier: concorrente
    status: confirmada

  - handle: lvstore
    tier: concorrente
    status: confirmada

  - handle: passaportefashionista
